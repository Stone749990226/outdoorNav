# 阶段八 · 校园级 100 m 场景的 nav2 参数（`worlds/campus_100.sdf`）
#
# **以 `nav2_params.yaml` 为底，只改场景相关项**（brief §3.1）。改动逐条列在这里，
# 除这几条之外**其余参数与底本逐字相同**（body 部分直接从 `nav2_params.yaml` 第 79 行起复制）：
#
#   ① 全局代价图栅格：40x40 @0.05 origin(-20,-20)  ->  **120x120 @0.10 origin(-60,-60)**
#      理由（brief §3.1）：100 m 场景要整块盖住；0.05 会得到 2400^2 的图，NavFn 规划代价过高。
#      0.10 下 inflation_radius 0.25 = **2.5 格**（够用）。
#   ② 全局代价图**加 `static_layer`**（reviewer 2026-10-09 定为硬要求 ⑤）：
#      `nav2_params.yaml` 的全局图只有 `obstacle_layer`（观测驱动、Overwrite + clearing）
#      ⇒ "车没走到之前楼在图上根本不存在"，而 `planner_server.GridBased.allow_unknown: true`
#      把未知格当可通行 ⇒ **100 m 场景里规划器会径直朝楼规划**（10 m 场景看不出来）。
#      图由 `static_walls.py` **从 world 现生成**（单一真源），参数化到 120x120 @0.10 / origin(-60,-60)。
#      ★ 判据：**车还没动**时，楼/绿地/车/周界墙在全局图上必须已是致命格且带 0.25 m 梯度。
#      ★ 局部图**不加**（与阶段七不同）：阶段七加是因为落差封边块在坡下**传感器看不到**；
#        校园场景全是高障碍，激光看得见，局部图交给 `obstacle_layer` 即可（少一处漂移源）。
#   ③ `desired_linear_vel` **0.16 -> 0.5 m/s**（演示实用性旋钮，AuYang 可改）：
#      100 m 单程在 0.16 m/s 下约 10 min，不可看；0.5 m/s 约 3.5 min。
#   ④ `xy_goal_tolerance` **0.05 -> 0.25 m**：中间点间距约 10 m ⇒ 0.25 m 是 2.5%。
#      （注意这条是**放宽**：阶段七为了斜坡落点收到 0.05，校园场景没有那个约束。）
#   ⑤ `navsat.yaml` 的 datum、`depth_drop.py`、阶段七的世界与配置 —— **本阶段一律不动**（红线）。
#
# ★ 底本里那些长注释（`min_obstacle_height` 的两层门、`inf_is_valid` 的来龙去脉等）
#   **原样保留在下面**：它们解释的是"这个值为什么是这个值"，与本阶段改不改无关。
# ★ 本文件**只被 `campus_nav2.yaml` 这一路使用**（起栈时 `nav2_config:=` 传进来）；
#   `nav2_params.yaml` 一个字节没动 ⇒ 阶段七的 `ramp7-bc` 仍可复跑 ✓。

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 2.0

      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 1.0

      # ★★ 阶段九（2026-10-10）：场景换成他们的 `north_campus.sdf` ⇒ 栅格要重定 ★★
      #   他们的场地 = 138 x 131 m，左下角 (-20,-103)、右上角 (118,28)。
      #   原值 120x120 @(-60,-60) 只盖到 x∈[-60,60]、y∈[-60,60] ⇒ **装不下** ✗。
      #   ⇒ 新值：**125 x 142 m @ origin(-25,-110)** ⇒ x∈[-25,100]、y∈[-110,32] ✓
      #     （★ 只盖到 x=100：本步 41 个目标点的 x 只到 **35.3** ✓，故 +x 侧留 65 m 余量就够 ✓；
      #      y 侧必须盖到 -103 ⇒ 取 -110 ✓，上侧到 32 盖过场地北界 28 ✓。）
      #   ★ **单位是米、不是格数** ✓（`Costmap2DROS` 自己除以 resolution ✓）——
      #     ★ 这条我**用证据反推核过** ✓：第 8 轮 `globalmap_stats.py` 报 1,314,356 格
      #     ≈ 0.91 x 1440000 = **1200x1200 格** = 120 m @0.10 ✓ ⇒ 确认单位是米 ✓。
      #   ★ origin 只在 resizeMap 时按这里的 origin_x/origin_y 设定（rolling_window=false ✓）。
      resolution: 0.10
      # **width/height 是整数参数**（nav2 声明成 ParameterValue(5)）：写成 40.0 会在
      # "Creating Costmap" 那一刻抛 InvalidParameterTypeException，把承载它的进程直接打崩
      # （实测：planner_server 崩掉后 lifecycle_manager 会一直等它的 get_state 服务，
      #  日志里看起来只是"卡住"，很容易误判成启动慢）。
      width: 125
      height: 142
      origin_x: -25.0
      origin_y: -110.0
      rolling_window: false

      # 与 Overwrite 配对（brief §2）：没观测过的格子保持 NO_INFORMATION，
      # Overwrite 才不会把"从没去过的地方"写成可通行。
      track_unknown_space: true

      # 每个周期发全图：覆盖增长曲线（判据 3）与地图更新频率（判据 7）都靠它取数。
      always_send_full_costmap: true

      # 底盘内切半径（TurtleBot3 burger）。inflation 的 inscribed 半径由它给。
      robot_radius: 0.105

      # ★ 阶段八改动 ②：**加 `static_layer`**（reviewer 2026-10-09 硬要求 ⑤）。
      #   它在 **inflation 之前** ⇒ 楼/绿地/车/周界墙会**带上 0.25 m 充气带** ✓
      #   （对照：`KeepoutFilter` 是 filter、跑在 inflation 之后 ⇒ 只能"穿不过去"、仍会贴着墙走）。
      #   图由 `static_walls.py` **从 world 现生成**（单一真源 ✓，不手抄坐标 ✓）：
      #   **只有障碍是占据(100)，其余一律未知(-1)** —— 不能把"没去过"写成"可通行"。
      # ★★ 2026-10-10 第 3 步（reviewer 转业主判断）：**拿掉 static_layer 试一轮** ✓ ★★
      #   ★ 原话要点：未知格在 NavFn 里只花 `COST_NEUTRAL`、比绕远便宜 ⇒ 规划器会**贴着楼面走**／
      #     切进楼的未观测部分 ✗（`campus8-b` 实测 `d=0.20 → -1（未知）`，中心可能只离楼面 ~0.15 m ✓）。
      #   ★ 而那个"贴墙"问题**另有既有修法** = `inflate_unknown: true` ✓（**与静态层是两件事** ✓）。
      #   ⇒ 本步**只改这一项** ✗：`allow_unknown` ✓／`inflate_unknown` ✓／`inflation_radius` ✓
      #     以及驱动侧**都不许顺手改** ✗（不然"是哪一项造成的"就分不开 ✓）。
      #   ★ 判据：**轨迹与楼面的最小距离 ≥ 0.355 m**（0.105 车半径 ＋ 0.25 膨胀）✓ ——
      #     若 < 0.355 ⇒ 视为"切进楼里" ⇒ **说明静态层必要** ⇒ 据此回退 ✓。
      #   ★ 拿掉前的基线（`campus8-midB`，**有** static_layer）＝ **0.5855 m** ✓。
      #   ---- 改动前原文（留证 ✓）：
      #     plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      plugins: ["obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /rtk/static_map
        # 发布者是 **latched**（transient_local）✓
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        # `lethal_threshold` 默认 100 ✓ —— 正好对上 `static_walls.py` 的 OCCUPIED=100 ✓（别改）
        # ★ 本图必须与 `static_walls.py` 的栅格参数**逐字一致**
        #   （0.10 / 120 / -60，见 launch 里 `static_resolution/size/origin`）：
        #   不一致时 StaticLayer 会按全局图自己的栅格去重采样 ⇒ **楼会被挪位** ✗。

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Overwrite（AuYang 定）：以最新观测为准，障碍移走后能被清掉。
        # 0=Overwrite / 1=Maximum / 其它=不更新（nav2 obstacle_layer.cpp 的 switch）。
        combination_method: 0
        # **层级 min/max_obstacle_height：第五阶段把 min 由 0.30 改成 0.02（有实测依据，见下）**
        #
        # 为什么必须改（否则本阶段的任务 2 直接失效）：
        #   nav2 的**层级**这一对是 marking 循环里的**逐点 z 带过滤**
        #   （反汇编 `ObstacleLayer::updateBounds`：`if (层min > z || 层max < z) skip`，
        #    读的是层对象自己的两个 double 成员）——它**对所有源一视同仁**，
        #   与源级那一对（喂给 ObservationBuffer 的）是**两道独立的门**。
        #   低装激光的扫描面在**地图帧 z≈0.11 m**，若层 min 还是 0.30，
        #   **激光的点一条都进不了 marking**——它只能清除、永远标不出低矮障碍，
        #   而"探低矮障碍"正是加这台激光的全部理由（brief §1.2）。
        # **nav2 的高度过滤是"两层门"，不对称——别把这两处参数当成"取同值才生效"**：
        #   第 1 层（**源级**，各源不同）：`ObservationBuffer::bufferCloud()` 把点云变换到
        #     地图帧后，**按该源自己的 min/max_obstacle_height 逐点过滤并丢弃**——
        #     被丢的点**既不标记也不清除**（射线清除里也不存在）。
        #     离线探针实测（喂 z = {-0.013, 0, 0.05, 0.11, 0.19, 0.30, 0.90}）：
        #       相机源(0.30/1.2) → **只留 0.300 与 0.900**；
        #       激光源(0.02/1.2) → 留 0.050 / 0.110 / 0.190 / 0.300 / 0.900；
        #       下限对照(0.12/1.2) → 留 0.190 / 0.300 / 0.900。
        #   第 2 层（**层级**，所有源一视同仁）：`ObstacleLayer::updateBounds()` 的
        #     **marking 循环**里还有一道 `if (z < min || z > max) continue;`
        #     （反汇编：读层对象自己那两个 double 成员，紧凑搬运跳过带外的点）——
        #     **被它挡住的点只是不标记，射线清除仍然照走**。
        # 为什么对相机是安全的（**相机源一个字没动**）：z<0.30 的相机点在第 1 层
        #   **就已经被丢掉了，根本到不了第 2 层**，所以层 min 放到 0.02 不会把
        #   0.12~0.16 m 的上飘像素放回来（离线 T3 也实测：z=0.10/0.25 的点不标记、
        #   0.50/0.90 标记）。实测判据仍是第三阶段的幽灵格核对。
        # 为什么**必须**改层 min：激光扫描面在 map 帧 z=0.11，若第 2 层还是 0.30，
        #   激光的点会被 marking 全挡掉（只能清、不能标），"加激光探低矮障碍"就等于没做。
        min_obstacle_height: 0.02
        max_obstacle_height: 1.2
        # **两条源各管各的**（brief §1.2）：相机管 0.30 m 以上（顺带把幽灵格挡住），
        # 激光管 0.02 m 以上（低矮障碍）。这正是"加激光"能替代"把相机阈值降到 0.12"的原因。
        observation_sources: camera_cloud scan
        camera_cloud:
          topic: /rtk/camera/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          # 裁定 4：显式覆盖默认 2.5/3.0，覆盖相机有效量程 6 m。
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          # 源级的 min/max_obstacle_height 是喂给 ObservationBuffer 的那一份
          # （**它是"丢弃点"的那一道门**，实测见上）。第五阶段**没有动它**。
          min_obstacle_height: 0.30
          max_obstacle_height: 1.2
        # ---- 第五阶段新增：低装 360° 激光（专管低矮障碍，brief §1.2）----
        #
        # ★★ 2026-09-21 改动（本轮：**把激光的入口换成与相机同一种**）★★
        #   只有两行配置变了：上面的 `observation_sources` **没动**（源名仍叫 `scan`）、
        #   下面的 ranges / 高度门 / marking / clearing **一个字没动**：
        #       topic:     /rtk/scan        --> /rtk/scan_points
        #       data_type: "LaserScan"      --> "PointCloud2"
        #   转换由自写节点 `scan_points.py`（launch 里的 `scan_points`）完成，
        #   它调的就是 nav2 内部同一个 `laser_geometry::LaserProjection`，几何逐点一致。
        #   **`/rtk/scan` 话题原样保留**（桥接没动）：换的是"nav2 从哪取"，不是"有没有数据"。
        #   ⚠️ 下面那段 `inf_is_valid` 的长注释是**改前**写的，现在**已失效**：
        #       · `inf_is_valid` 是 **LaserScan 源专有**的键，PointCloud2 源不读它
        #         ⇒ 它现在是个**惰性键**（留着是为了让本轮 diff 只有上面那两行）；
        #       · 它原来承担的那件事（"无回波 ⇒ 有端点 ⇒ 清成空闲"）现在由
        #         `scan_points.py` 的 `emit_far_points` 承担，替换值 7.9999 与
        #         nav2 自己的 `range_max - 1e-4` **逐位相同** ⇒ 行为等价。
        #       · **但那段注释里"7.5 而不是 8.0"的实测依据仍然有效**，且是本次替换值
        #         取 7.9999 的**同一条前提**（远点必须落在标记量程之外）——别删。
        scan:
          topic: /rtk/scan_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          # **`inf_is_valid: true` 让激光天然满足任务 1.1**：无回波（inf）的束由
          # nav2 的 `laserScanValidInfCallback` 替换成 `range_max - 1e-4`
          # （反汇编读出的常量 0x38D1B717 = 1e-4）再投影，于是那些方向**有端点**，
          # 射线把沿途清成空闲（清到 `raytrace_max_range`）。
          # ⚠️ 顺带一条实测：laser_geometry **会丢掉 `r >= range_max` 的束**，
          #    所以"无回波束能变成端点"完全依赖 nav2 这一步替换（直接喂 inf 投影出 0 个点）。
          inf_is_valid: true
          # **obstacle_max_range 取 7.5 而不是 8.0（对 brief 的偏离，有实测依据）**：
          #   brief §1.2 写的是 `obstacle_max_range = raytrace_max_range = 8.0`。
          #   但 nav2 把无回波束放在 **7.9999 m**（= range_max-1e-4），而 marking 的判据是
          #   **严格小于**（反汇编：`if (sq_obstacle_max_range <= sq_dist) skip`）。
          #   实测（离线探针，360 束全为无回波）：`obstacle_max_range = 8.0` 时
          #   **360/360 束都会被标成致命障碍**（sq_dist = 63.9984 < 64）→
          #   开阔方向会长出一圈**假墙**（判据 ③"幽灵格不回来"会不通过）；
          #   取 7.5 则 **0/360** 被标，而 5 m 处的真实回波仍是 360/360 被标 ✓，
          #   清除范围不受影响（仍是 `raytrace_max_range = 8.0`）。
          #   **代价（如实记，进已知限制）**：**7.5~8.0 m 的真实障碍只清不标**。
          #   本场景实测 360 束里**最大有限回波 7.228 m（< 7.5 m）**，即所有真实障碍
          #   的实测回波都在 7.5 m 以内，所以这一档没有实际影响。
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          # 源级阈值：0.02 = brief §1.2 的值，与层级的 0.02 一致。
          # 注意**不是**把相机那套 0.30 抄过来：扫描面本身就在 0.11 m，
          # 阈值高于 0.11 会让这台传感器一个点都用不上。
          min_obstacle_height: 0.02
          max_obstacle_height: 1.2

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # 膨胀半径 0.25 m 沿用第一阶段的依据（底盘内切 0.105 + 安全余量 0.15）。
        inflation_radius: 0.25
        # nav2 用指数衰减：cost = 253 * exp(-factor * (d - inscribed))。
        # 取 3.0（nav2 常用值）。**注意**：这与第二阶段自写膨胀的**线性**衰减不是同一条曲线，
        # 所以"代价 >= 阈值"对应的实际离障距离会变——实测停车距离见验证文档，
        # 不与第一阶段的 0.60 m 强行凑数（凑数要改 cost_scaling_factor 到 36，那是为了让数字好看而扭曲参数）。
        cost_scaling_factor: 3.0
        # ★★ 阶段八改成 **true**（实测依据，不是照抄默认值；底本是 false）★★
        # 本图**大部分格子是"未知"**（`track_unknown_space: true` + 静态层只标障碍），
        # 而 `inflate_unknown` 默认 false ⇒ 充气**写不进未知格** ✗。
        # 实测（`campus8-b`：沿 `bld_main` 西面 x=-30.6 向西逐点读 `/global_costmap/costmap`）：
        #     d=0.00 → 100 ｜ 0.05 → 100 ｜ 0.10 → 99 ｜ 0.15 → 99 ｜ **0.20 → -1（未知）**
        #   ⇒ 充气带只有 ~0.15 m，**没铺满 `inflation_radius` 的 0.25 m** ✗。
        #   后果不是"撞"（致命格仍然拦得住），而是**规划器会贴着墙走**：未知格在 NavFn 里
        #   只花 `COST_NEUTRAL`，比绕远便宜 ⇒ 机器人中心可能只离楼面 ~0.15 m，
        #   而车体半径 0.105 + 定位误差 ⇒ 贴脸。
        # ★ 打开后只影响"离致命格 0.25 m 以内的未知格"，远处未知格仍是未知 ⇒
        #   与 `track_unknown_space: true`（不谎报可通行）的用意不冲突 ✓。
        inflate_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      # 局部图是"相对机器人的即时障碍"，跟随相机 10 Hz 出图，取 5 Hz 更新/发布。
      update_frequency: 5.0
      publish_frequency: 5.0

      # ★ 2026-09-22 由 `base_link` 改为 `odom`（AuYang 拍板）。**两边理由都留着，别只留新的。**
      # 原来挂 base_link 的理由：**绕开腿式里程计不可信**（原注释原文）—— 图框=车体，
      #   机器人永远在图的中心、朝向永远沿 +x。
      # 为什么改掉：**图框是车体 ⇒ 车转向时旧格内容不跟着转**（nav2 滚动窗只平移原点、不旋转旧格），
      #   旧格滞留在已看不到的方向 ⇒ **原地转一圈会在局部图上围出一个闭环**（现场截图可见 ✗）。
      #   验证文档判据 8 量到过"视场外占据格 +12%"；同文档另有一句"逐格 diff 在 base_link 帧上不成立"。
      # 换到 odom 的代价（**这是取舍，不是纯修** ✗）：**局部图改随里程计走** ⇒
      #   ① 短窗内 odom 的漂移会进图（`ekf_local` 的 odom→base_footprint 质量就是要绕开的那件事）；
      #   ② 好处是 `map→odom` 被 RTK 修正跳变时，**局部图内容不跟着跳**（对控制通常正是要的）。
      # 未实测即改（按结构性推断 + AuYang 拍板）；改完的验收 = 原地转一圈不再拉圈 + 给目标点仍能走 ✓。
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.5

      resolution: 0.05
      # 窗口 8 m 沿用第一阶段（相机有效量程 6 m，够用），比危险判据的 3 m 视距宽得多。
      # width/height 同样是**整数**（见全局图那处的说明）。
      width: 8
      height: 8
      rolling_window: true

      # 局部图不跟踪未知：nav2 局部图的常规取法。危险判据只看"代价 >= 阈值"的格子，
      # 未知/空闲都不会被判成危险，语义与第一阶段的"未知不算危险"一致。
      track_unknown_space: false
      always_send_full_costmap: true
      # 局部图**不开** trinary：危险判据要读膨胀梯度（0..100），
      # trinary 会把发布出来的图压成 0/100/-1 三值，梯度就没了。
      trinary_costmap: false
      robot_radius: 0.105

      # **局部图用 2D `obstacle_layer`，不用 `voxel_layer`**（brief §11 口径修订 1，reviewer 复验后改）。
      #
      # 为什么改：同一套脚本实测，`obstacle_layer` + Overwrite 的**全局图高低障碍都能清**
      # （矮 9→0、高 8→0），而 `voxel_layer` 的局部图**高障碍永远清不掉**（矮 0.25 m 能清、高 1.0 m 不能）。
      # 根因是 nav2 自身行为：射线清除沿新射线**逐体素**清，而**高障碍的上部体素不在任何后续射线的
      # z 路径上**；`mark_threshold=0` 又让"该列还剩任一标记体素"就不把 2D 格判 free，体素层也没有衰减。
      # 换成 2D 层后语义与全局图一致，也就不用再解释"两张图组合方式不同"。
      #
      # 参数与全局图**逐项对齐**（brief §11）：combination_method 0、相机源 ranges 6.0、
      # **层级高度 min/max = 0.02 / 1.2**（与全局图同值；0.30→0.02 的理由、两道门的
      # 机制与实测都在全局图那一段，这里不重复）、新增的 `scan` 源逐项同值。
      # ⚠️ 这行原来写的是"高度 0.12/1.2"——**是过时注释**：2026-09-21 实测把两处
      # `min_obstacle_height` 一起由 0.12 抬到 0.30（"逐项对齐"才成立，只改一处会变成
      # "注释说一套、值写另一套"，本项目为这种不一致反复吃过亏）；第五阶段又一起改成 0.02。
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 0
        # 层级的 min/max：0.02/1.2（理由见全局图那一段）
        min_obstacle_height: 0.02
        max_obstacle_height: 1.2
        observation_sources: camera_cloud scan
        camera_cloud:
          topic: /rtk/camera/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.30
          max_obstacle_height: 1.2
        # 低装激光（第五阶段）：与全局图逐项同值。
        # 局部窗口只有 8x8 m（±4 m），所以 7.5/8.0 这组范围在局部图上都够不到边界；
        # 取同值是为了"两张图逐项对齐"这条规矩，不是为了局部图本身的需要。
        # ★ 2026-09-21（本轮）：与全局图**同步**换入口 —— 同样只改 topic 与 data_type 两行，
        #   同样保留源名 `scan`、保留其余全部取值与那个已失效的 `inf_is_valid`。
        #   **两张图必须一起换**：只换一张会变成"两张图的激光入口不同"，
        #   本轮判据④（两张图分列）就失去可比性。
        scan:
          topic: /rtk/scan_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.02
          max_obstacle_height: 1.2

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.25
        # （局部图这一处**保持底本的 false**，见全局图那一处的长注释 ①；局部图是滚动窗口、
        #   窗口内几乎全是"已观测"，未知格很少，没有全局图那个"贴着静态墙规划"的问题。）
        cost_scaling_factor: 3.0
        inflate_unknown: false

# ============================================================ 第四步新增：控制器接管
#
# `controller_server`（nav2 原生）接管控制，**并承载 `local_costmap`**——
# 第三阶段自写的 `local_costmap_host` 随之退役（代码保留，launch 里默认不起）。
# 上面的 `local_costmap: local_costmap:` 参数段**原样不动**：那本来就是 nav2 惯例布局
# （Costmap2DROS 的节点全限定名就是 `/local_costmap/local_costmap`），换宿主不用改结构。
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    # 速度阈值：0.16 m/s 的车，这些阈值必须很小，否则零速附近会被当成"没有速度指令"
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    # ---- 坑（reviewer 开工前点出）：`odom_topic` 默认 `/odom`，本系统里没有这个话题 ----
    # 本项目的里程计是 `wheel_odom_bridge → ekf_local`，发在 **`/odometry/local`**，
    # 并且由它发 `odom→base_footprint` 的 TF。不显式改的话 RPP 拿不到速度反馈，
    # 现象大概率是"控制器起来了但不动"或反复报取不到 odom，而日志里看起来像"参数没生效"。
    # **两处都设**：RPP 实际读的是插件级 `FollowPath.odom_topic`（下面那处），
    # 服务级这个是为了防止 nav2 版本差异/别的插件从服务级取；多设一个未用的键无害。
    odom_topic: /odometry/local

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker", "goal_checker"]
    controller_plugins: ["FollowPath"]

    # ---- 坑 1：默认 progress_checker 会把慢车误判成"卡住" ----
    # nav2 默认 `required_movement_radius: 0.5` / `movement_time_allowance: 10.0`，
    # 意思是"10 秒内至少要挪 0.5 m"。这台车巡航只有 **0.16 m/s**，10 秒理论位移 1.6 m，
    # 看着够——但过弯、被 `regulated_linear_scaling` 减速、或起步转向时实际位移会掉到阈值以下，
    # 一旦误判 → `FollowPath` 立即失败 → `goal_navigator` 的重规划循环就会不停重发
    # （reviewer 明确点出这条，说"你一定会撞"）。
    # 放宽到 0.15 m / 20 s（≈ 0.0075 m/s 的有效进度门槛），比任何正常行进都低得多。
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # ★ 阶段八改动 ④：底本这份就是 0.25（brief §3.1 要求 0.05 -> 0.25）——
      #   **0.05 在 `depth_drop_nav2.yaml` 里**（阶段七为斜坡落点收的），本文件底本是 `nav2_params.yaml`，
      #   它的值本来就是 0.25 ⇒ 这里**没有可改的**，写明以免被读成"漏改了" ✓。
      #   口径：中间点间距约 10 m ⇒ 0.25 m = 2.5%。
      # ★ 阶段八（2026-10-10）：一度改成 **0.15**，**实测更差、已回退** ✗。
      #   收紧后 `campus8-g` 那轮：`wp0` 最小 0.0234 m 但**最终 4.08 m**、`wp1` 最小 2.780 m ✗。
      #   真因**不在容差**：自定义 `goal_navigator` 的"过期 token 结果被丢弃" ⇒ `arrived` 永不置位
      #   ⇒ **全局图一更新就重发目标** ⇒ 车被反复下命令、离开刚到的点 ✓。
      #   容差越小 ⇒ 越难判成功 ⇒ 越容易被重发/恢复行为接管 ⇒ **更差** ✓。
      #   ⇒ 由 reviewer 裁定**回退 0.25** ✓；真正要修的是 `goal_navigator`（已按窄修处理，见那里）。
      # ★★ 2026-10-13：**这个值与下面 `goal_checker:` 那处必须同值** ✗（★ 两处说的是一件事 ✓）
      #   ★ 为什么有两处 ✓：★ 他们的 `bridge.py:214` **硬写** `goal_checker_id = goal_checker` ✓
      #     ⇒ ★ 只有**同名同参数**才对得上 ✓ ⇒ ★ 加了个名字 ✓（✗ 不是改判据 ✗）
      #   ★ ★ **改一处要改两处** ✗ —— ★ 只改这里 ⇒ ★ **注释说一套、值写另一套** ✗
      #     （★ 同形于本文件 `min_obstacle_height` 的三处 ✓、`odom_topic` 的"两处都设" ✓）
      #   ★ ⚠ ✗ **别用 YAML 锚点收成一处** ✗：★ 试过 ⇒ ★ nav2 用的 rcl 解析器
      #     **不支持别名** ✗（`Error: Will not support aliasing at line 400` ✓）⇒
      #     两个 nav2 主节点**当场 SIGABRT** ✗（★ 2026-10-13 实测 ✓、已回退 ✓）
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5

    # ---- 控制器：RegulatedPurePursuitController ----
    # 选它而不是 DWB：低速差速底盘、参数少、行为可解释（brief §2 的建议）。
    # ★★ 2026-10-12：**同参数的第二份 goal_checker** ✓（★ 纯新增 ✓）
    #   ★ 为什么 ✓：★ 他们前端那条链里 `bridge.py:214` **硬写** `goal_checker_id = "goal_checker"` ✓
    #     ★ 而本仓只有 `general_goal_checker` ✓ ⇒ ★ **实测被拒** ✗（原句：
    #       `FollowPath called with goal_checker name goal_checker in parameter
    #        'current_goal_checker', which does not exist. Available goal checkers are:
    #        general_goal_checker .`）
    #   ⇒ ★ 加一个**同名、同参数**的 ⇒ ★ 他们的桥**原样能接上** ✓ ∧ ★ 不改他们仓库一行 ✓
    #   ★ 语义 ✓：nav2 是"**任一** goal checker 判到达即停" ✓ ⇒ ★ 参数一字不差 ⇒ **行为等价** ✓
    #     （★ 所以这是"**加名字**" ✗ 不是"改判据" ✗ —— ★ 但配置一动，41/41 **必须重跑** ✓）
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # ★★ 2026-10-13：**与上面 `general_goal_checker` 那处必须同值** ✗（★ 改一处要改两处 ✓）
      #   ★ 两处的值**故意**各写一份 ✓ —— ★ 因为 rcl **不支持 YAML 别名** ✗（见上面那段的实测 ✓）
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # ★ 阶段八改动 ③：0.16 -> **0.5 m/s**（演示实用性旋钮，AuYang 可改）。
      #   100 m 单程：0.16 m/s 约 10 min（不可看）｜0.5 m/s 约 3.5 min。
      desired_linear_vel: 0.5
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.5
      # 速度来源：局部 EKF 的 `/odometry/local`（odom 帧，融合轮式里程计 + IMU）。
      # 注意这只用于**速度**；位姿走 TF（map→base_footprint），与第三阶段一致。
      odom_topic: /odometry/local

      # 终点段减速，避免冲过目标
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5

      # ---- 坑 4：`regulated_linear_scaling_min_radius` 必须比 `inflation_radius` 大 ----
      # 代价地图（两张图共用）的 `inflation_radius` 是 **0.25 m**。RPP 的"贴障碍减速"那一档
      # 是拿这个半径和代价比出来的——如果它比膨胀半径还小，减速档**永远不会触发**，
      # 现场解说就会名不副实（不影响判据，但要说实话）。取 0.45 m。
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.45
      regulated_linear_scaling_min_speed: 0.05

      # 碰撞检测：向前投影一段，撞了就减速（演示时"贴着墙走会慢下来"是可见的）
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

      # 转向：**关掉原地转**（第四步实测的坑，见下）。
      # 开着的后果实测是"车一动不动，看着像控制器或底盘坏了"：
      #   `use_rotate_to_heading: true` 时 RPP 只要朝向误差超过 `rotate_to_heading_min_angle`
      #   就把 `linear.x` **强制置 0**、只发角速度；而它发出的角速度实测只有 ±0.1 rad/s，
      #   转不动 → 朝向误差一直不收敛 → 一直停在"先转再走"这一步。
      #   证据：45 s 内 279 条 /cmd_vel 采样，**线速度非零的 0 条**，角速度在 ±0.11 内来回摆；
      #   同一时刻 controller_server 报 progress_checker 的 `Failed to make progress`
      #   （20 s 内没挪够 0.15 m）→ FollowPath 中止。**底盘本身是好的**：手动发
      #   0.15 m/s 直行挪了 0.34 m、发 1.0 rad/s 转了 0.8 rad，odom 都跟着动。
      # 关掉之后 RPP 正常走"边走边修正朝向"，差速底盘完全够用（本演示要的是车真的走起来）。
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 1.0
      allow_reversing: false

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # 未知 = 可走 落在规划器上（brief §2）：全局图大部分格子是未知，
      # 否则"从零累积"的图根本规划不出路径。
      allow_unknown: true
      # 目标点落在障碍/膨胀里时允许的放宽量（米）。
      tolerance: 0.25
      use_astar: false

