planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.20
      allow_unknown: true
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /outdoor/odom
    controller_frequency: 10.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.50
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.4
      max_vel_y: 0.0
      max_vel_theta: 0.4
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.0
      acc_lim_theta: 0.6
      decel_lim_x: -0.3
      decel_lim_y: 0.0
      decel_lim_theta: -0.6
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.2
      trans_stopped_velocity: 0.01
      xy_goal_tolerance: 0.50
      short_circuit_trajectory_evaluation: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 0.1
      GoalAlign.scale: 0.2
      PathDist.scale: 0.5
      GoalDist.scale: 0.5
      RotateToGoal.scale: 1.5
      RotateToGoal.xy_goal_tolerance: 0.50
      RotateToGoal.slowing_factor: 1.0
      RotateToGoal.lookahead_time: 0.5
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.4, 0.0, 0.4]
    min_velocity: [0.0, 0.0, -0.4]
    max_accel: [0.3, 0.0, 0.6]
    max_decel: [-0.3, 0.0, -0.6]
    velocity_timeout: 0.3
    odom_topic: /outdoor/odom
