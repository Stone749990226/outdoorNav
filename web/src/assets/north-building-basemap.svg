<svg xmlns="http://www.w3.org/2000/svg" width="976" height="952" viewBox="0 0 976 952">
  <title>杭州湾智慧谷 · 北区园区示意底图</title>
  <desc>依据用户提供的高德地图与卫星图重绘。中央三十层主楼、东侧裙楼、屋顶花园与西南绿地为示意，沿实测环线布局；建筑投影仅表现日照阴影，不代表建筑占地或导航障碍。</desc>
  <defs>
