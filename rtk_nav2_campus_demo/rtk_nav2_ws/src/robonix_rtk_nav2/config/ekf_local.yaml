# 局部 EKF：发布 odom → base_footprint
#
# 职责：给整条 TF 链提供一个**连续、高频**的底盘帧。
# 输入只有底盘自己的东西（轮式里程计 + IMU），不含任何绝对定位。
#
# 它在"不强依赖里程计"里的角色：map→odom 是由全局 EKF 用绝对定位算出来的，
# 而地图帧里的位姿 = (map→odom) ∘ (odom→base)。里程计变差只会让 odom→base 漂，
# map→odom 会等量补偿，最终 map→base 不受影响。所以这一路可以放心用里程计。
ekf_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true
    print_diagnostics: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 轮式里程计（经 odom_bridge 转发，默认直通）
    # 15 个布尔位依次是 x,y,z,roll,pitch,yaw, vx,vy,vz,vroll,vpitch,vyaw, ax,ay,az
    odom0: /wheel_odom_used
    odom0_config: [true, true, false,
                   false, false, true,
                   true, true, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU：只取航向与航向角速度。加速度不取（本场景没有用到俯仰/横滚，
    # 取进来只会把 IMU 的加速度噪声引到位置估计里）。
    imu0: /rtk/imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true
