# 路线与安全阈值
#
# 路线是 **map 坐标（绝对）**下的折线，单位米：相对 RTK 基准点（世界原点）的东/北。
# 这是本版与视觉版最本质的差别——路线可以按真实坐标写死，不用"从出生点算起"。
#
# 取 (±2.6, ±2.6) 方环。**净空是踩过坑之后重算的**：
# 第一版用 ±3.3，环线走廊（中央方块面 1.25 ↔ 原来那圈外墙的内表面 4.925）里还塞着
# 隔墙与立柱，实测净空只有：立柱 (-4.3,3.0) 到边 y=+3.3 **0.30 m**、隔墙到边 0.60 m——
# 都贴着 0.45 m 的停车阈值。机器人正常跑第三段就会被柱子逼停（实测退出码 5），
# 而当时误以为是"代价地图的假障碍"。
#
# 现在：路线收到 ±2.6，同时把三根立柱挪到四角（见 scripts/make_world.py）。逐项净空：
#   中央方块面 1.25 m         -> 1.35 m
#   隔墙 p1（y=+3.9）/ p2（x=-3.9） -> 1.22 m
#   立柱（四角 4.5,4.5 等）    -> 2.40 m
#
# **四周围墙已于 2026-09-21 按 AuYang 要求整段删除**（生成器、世界文件、几何核对
# 模块三处一起改的）。**注意地面方板的尺寸当天又改过一次（10.70 -> 22.70 m）**。
# 改的理由是**去掉外墙之后要留出可行驶的地面余量**：去墙后世界里唯一的地就是那块
# `ground`（22.7×22.7 -> 板边 ±11.35 m），旧板只有 ±5.35 m，**车走出 ±5.35 m 就没有地面可踩**
# （防御性理由；本场景目标点都在 ±2.6 m 内，未被实测触发）。
# ⚠️ 这条理由原来写成"把板边丢出相机量程、消掉板边深度泄漏的幽灵格"，
# **那条归属已被 2026-09-21 的 ablation 反证**（见 `docs/rtk-nav2.md` §8.2/§8.3），不再作为理由；
# 幽灵格是**被 `min_obstacle_height` 拦住的**，具体来源仍未定。
# 路线环往外仍是空地，**不再有"外墙内表面 4.925 m"这一说**。
# 取代它的是 4 段"非封闭"独立墙 obstacle_00..03（见 scripts/make_world.py 的 OBSTACLES）：
# 它们**全在路线环外侧**，最近的一段（obstacle_01，x=3.6 / y=2.2~3.4）离环 **0.925 m**，
# 其余 1.33 / 1.33 / 1.80 m。所以路线本体一个字不用改——车贴着 ±2.6 走时，
# 最近的墙还留着 0.925 m，是停车阈值 0.45 m 的 2.1 倍。
#   最小净空 0.925 m，远大于定位误差（实测 ~0.08 m）与控制横向误差之和。
route_follower:
  ros__parameters:
    # 方环：起点 (2.6, -2.6) -> (2.6, 2.6) -> (-2.6, 2.6) -> (-2.6, -2.6) -> 回到起点
    route: [2.6, -2.6, 2.6, 2.6, -2.6, 2.6, -2.6, -2.6]
    loop_count: 1

    max_linear_speed: 0.16
    max_angular_speed: 0.6
    linear_gain: 0.6
    angular_gain: 1.4
    goal_tolerance: 0.15

    # 安全：nav2 局部代价地图的前方危险距离 < 0.45 m 停车；< 0.90 m 线性减速。
    # **阈值一个字没改**：第三阶段把地图与膨胀换成 nav2 之后，这两个判据的语义仍然成立
    # （代价 >= 50 的最近距离），但那条"代价 >= 50"的等值线相对障碍的位置变了
    # （nav2 用指数衰减、第二阶段自写膨胀用线性衰减），所以**实测停车距离会变**，
    # 见 docs/rtk-nav2-validation.md。
    obstacle_stop_distance: 0.45
    obstacle_slow_distance: 0.90

    pose_timeout: 0.7
    # 代价地图状态超时：代价地图在负载高时约 3 Hz，状态从头像随每个周期发布，
    # 正常间隔 0.3 s 左右；给到 3 s 是为了容忍偶发的计算抖动，同时仍能及时判失效。
    danger_timeout: 3.0
    startup_grace: 30.0
    total_timeout: 420.0
    control_rate_hz: 10.0
    report_path: ''
