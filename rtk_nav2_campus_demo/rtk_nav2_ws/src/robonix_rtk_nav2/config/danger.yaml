# 前向危险距离（自写节点，第三阶段收缩后只做这一件事）
#
# 与第二阶段的关系：第二阶段这份文件叫 costmap.yaml，节点自己建图 + 膨胀 + 出危险距离；
# 第三阶段地图与膨胀都交给 nav2，本节点只从 **nav2 的局部图** 里取"前方扇区最近障碍距离"。
# 所以原来的 window_size_m / inflation_radius_m / min_range / max_range /
# global_size_m / scan_* / trajectory_clearing 等参数**全部作废**（近场激光也按 AuYang 的决定移除）。
danger:
  ros__parameters:
    # **注意话题名**：nav2 的两张图按 nav2 原生命名发布——
    # Costmap2DROS 用相对名 "costmap" 建发布者，相对名解析到**节点的命名空间**
    # （`/local_costmap`），所以实际话题是 `/local_costmap/costmap`，
    # **不是** `/rtk/local_costmap/costmap`。第三阶段一开始按第二阶段的
    # `/rtk/` 前缀猜的，现象是"就绪判定永远等不到局部图、危险距离一直 wait"，
    # 而 `ros2 topic list` 里**确实有** `/rtk/local_costmap/costmap` 这个名字
    # ——那只是因为本节点在订阅它（话题名有订阅者就会出现在列表里），发布者数为 0。
    # 判据用 `ros2 topic info` 看 Publisher count，别看名字在不在列表里。
    costmap_topic: /local_costmap/costmap
    cloud_topic: /rtk/camera/points

    # 局部图的帧。nav2 那边配的是 base_link（AuYang 定）。
    # 本节点把"机器人恒在图心、朝向 +x"当前提，所以这里必须与 nav2 一致；
    # 不一致时 on_costmap 会直接报 error（不是静默算错）。
    base_frame: base_link

    # 安全扇区：正前方 ±35 度、3 m 以内，取代价 >= 阈值的最近距离。
    # 口径与第二阶段一致（±35 度 / 3 m），这样 route_follower 的
    # obstacle_stop_distance=0.45 / obstacle_slow_distance=0.90 不用改。
    danger_half_angle_deg: 35.0
    danger_max_range_m: 3.0
    # nav2 发布出来的栅格值域是 0..100（内部 0..255 除以 2.55）。
    # 阈值取 50 与第二阶段同一个数，但**含义不同**：第二阶段的膨胀是自写的**线性**衰减，
    # 这里是 nav2 膨胀层的**指数**衰减 cost = 253 * exp(-factor * (d - inscribed))，
    # 所以"代价 >= 50"对应的离障距离变了——实测停车距离见 docs/rtk-nav2-validation.md，
    # 不与第一阶段的 0.60 m 强行凑数。
    danger_cost_threshold: 50

    # 判活超时。**取值有实测依据，不是拍的**：第三阶段在负载较高时量到
    #   - 深度图 6.7 Hz，最大间隔 0.18 s；
    #   - 点云 3.5 Hz，最大间隔 **1.34 s**（`point_cloud_xyz` 偶尔要 1 s 以上才出下一帧）；
    #   - 局部代价地图 2.5 Hz，最大间隔 0.42 s。
    # 原来两个都取 1.0 s：点云那个最大间隔会**踩线**——一旦某次间隔超过 1 s，
    # 本节点就报 stale，`route_follower` 立刻以退出码 3 中止（"感知失效"）。
    # 实测还没撞上，但余量只有 0（1.34 > 1.0 已经发生过），属于必须收紧的脆弱点。
    # 现在给到实测最大间隔的 ~1.5 倍；route_follower 那边的 danger_timeout 是 3.0 s，
    # 仍能在它的窗口内判出失效，不会拖长停车反应。
    cloud_timeout: 2.0
    costmap_timeout: 1.5
    publish_rate_hz: 10.0
